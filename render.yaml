services:
  - type: web
    name: researchmind-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.enableCORS false
    envVars:
      - key: TAVILY_API_KEY
        sync: false          # paste the value manually in Render dashboard
      - key: MISTRALAI_API_KEY
        sync: false          # paste the value manually in Render dashboard if needed
    autoDeploy: true
